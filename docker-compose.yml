  db:
    image: postgres:16-alpine
    container_name: cmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmb
      POSTGRES_PASSWORD: cmb
      POSTGRES_DB: cool_magic_battles
    ports:
      # 5433 — чтобы не конфликтовать с локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmb -d cool_magic_battles"]
      interval: 3s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: cmb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: ${CMB_MINIO_IMAGE:-cmb-minio:2025-09-07}
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: cmb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  minio-data:
