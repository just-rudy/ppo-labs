database:
  # Переопределяется через DATABASE_URL в .env (см. env.example)
  # Локально без Docker (peer auth, пользователь ОС = владелец БД):
  url: "postgresql+psycopg:///cool_magic_battles"


game:
  default_hand_size: 5
  default_market_size: 5
  default_base_health: 20

redis:
  # Внешний кэш (in-memory СУБД). make redis-up или docker compose up -d redis
  url: "redis://localhost:6379/0"
  enabled: true
  catalog_ttl_seconds: 300

logging:
  file: "logs/app.log"

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "cards"
  secure: false
  presign_ttl_seconds: 3600
  auto_create_bucket: true
  # Изображение-заглушка для карт без загруженного файла.
  # Укажи object name (путь внутри bucket) нужного файла.
  default_image_object: "cards/default.png"
